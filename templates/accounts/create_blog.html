{% extends 'accounts/base.html' %}

{% block title %}HireWave - Create Blog Post{% endblock %}
{% load static %}

{% block content %}

<div class="page-title-container">
    <div class="row">
        <div class="col-12 col-md-7">
            <h1 class="mb-0 pb-0 display-4" id="title">Create Blog Post</h1>
            <nav class="breadcrumb-container d-inline-block" aria-label="breadcrumb">
                <ul class="breadcrumb pt-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<section class="scroll-section" id="floatingLabel">
    <h2 class="small-title">Create Blog Post</h2>
    <div class="card mb-5">
        <div class="card-body">
            <form id="createBlogPostForm" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
                {% csrf_token %}
                
                <!-- Title Field -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="title" name="title" placeholder="Title" required />
                    <label for="title">Title</label>
                </div>

                <!-- Slug Field (optional) -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="slug" name="slug" placeholder="Slug" />
                    <label for="slug">Slug (optional)</label>
                </div>

                <!-- Content Field -->
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="content" name="content" placeholder="Content" rows="5"></textarea>
                    <label for="content">Content</label>
                </div>

                <!-- Cover Image Field -->
                <div class="form-floating mb-3">
                    <input type="url" class="form-control" id="cover_image" name="cover_image" placeholder="Cover Image URL" />
                    <label for="cover_image">Cover Image URL (optional)</label>
                </div>

                <!-- Tags Field -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="tags" name="tags" placeholder="Tags (comma-separated)" />
                    <label for="tags">Tags (comma-separated)</label>
                </div>

                <button class="btn btn-primary" type="submit">Create Blog Post</button>
            </form>
        </div>
    </div>
</section>

<script src="https://cdn.ckeditor.com/ckeditor5/41.1.0/classic/ckeditor.js"></script>
<script>
    console.log("Welcome")
    let editor;

    ClassicEditor
        .create(document.querySelector('#content'), {
            codeBlock: {
                languages: [
                    { language: 'python', label: 'Python' },
                    { language: 'javascript', label: 'JavaScript' },
                    { language: 'html', label: 'HTML' },
                ]
            },
            mediaEmbed: {  // Enable media embed functionality
                previewsInDataBinder: true  // Optionally enable preview in the data binder
            },
            toolbar: [
                'heading', '|', 'bold', 'italic', 'link',
                'bulletedList', 'numberedList', 'blockQuote',
                'imageUpload', 'codeBlock', 'mediaEmbed',  // Add mediaEmbed to toolbar
                'fontColor', 'fontBackgroundColor'  // Text color options if you have them
            ],
        })
        .then(newEditor => {
            editor = newEditor;
        })
        .catch(error => {
            console.error(error);
        });

    function validateForm() {
        const contentValue = editor.getData();
        document.querySelector('#content').value = contentValue;

        if (!contentValue.trim()) {
            alert('Content is required.');
            return false; 
        }

        return true; 
    }
</script>


<style>
    .ck-editor__editable {
        min-height: 300px;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        padding: 0.375rem;
        font-family: Arial, sans-serif;
        font-size: 1rem;
        color: #495057;
    }

    .ck-editor__editable[contenteditable="true"]:focus {
        border-color: #80bdff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        outline: 0;
    }

    .ck-toolbar {
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        margin-bottom: 10px;
    }

    .ck-toolbar__items {
        display: flex;
    }
</style>

{% endblock %}
